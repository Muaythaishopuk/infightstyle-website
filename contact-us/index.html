<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Infightstyle Fight League</title>
<meta name="description" content="Get in touch with Infightstyle Fight League for info on any of our events.">
<meta property="og:title" content="Contact | Infightstyle Fight League">
<meta property="og:description" content="Get in touch with Infightstyle Fight League for info on any of our events.">
<meta property="og:image" content="https://www.infightstylefightleague.co.uk/images/gallery-body-kick.jpg">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<script src="/events.js" defer></script>
<script src="/assets/site.js" defer></script>
</head>
<body>
<header id="site-header"></header>
<main>
<section class="page-banner wrap">
  <h1>Contact us</h1>
  <p>Get in touch for info on any of our events.</p>
</section>
<section class="section" style="padding-top:1.5rem">
  <div class="wrap" style="max-width:720px">
    <div class="panel center">
      <h3>Drop us a line</h3>
      <p><a class="contact-email" data-email="email"></a></p>
      <p style="color:var(--muted)">Want to fight on one of our events? Get your coach to get in touch.</p>
      <div class="actions" style="justify-content:center"><a class="btn" data-email="email">Email us</a></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:2rem 0">
      <p style="color:var(--muted)">Or message us on social media</p>
      <div data-socials></div>
    </div>
  </div>
</section>
</main>
<footer id="site-footer"></footer>
</body>
</html>
