[project]
name = "infightstyle-tools"
version = "0.1.0"
description = "Reusable planning tools for INFIGHTSTYLE events (venue floor plans)."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra --cov=venue_layout --cov-branch --cov-report=term-missing --cov-fail-under=95"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "COM812", # conflicts with the formatter
    "CPY001", # private project: no copyright header needed
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
warn_unreachable = true
disallow_any_explicit = true
files = ["venue_layout", "tests", "check.py"]
