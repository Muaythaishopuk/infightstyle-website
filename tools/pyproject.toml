[project]
name = "fightcard"
version = "0.1.0"
description = "Builds fight-night running orders (corners, class order, timings) from the event spreadsheet."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "COM812", # conflicts with the formatter
    "T201",   # the CLI prints its report on purpose
    "CPY001", # no copyright header needed in a private tool
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "D100", "D103", "D104"]

[tool.mypy]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=fightcard --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = ["fightcard/__main__.py"]
